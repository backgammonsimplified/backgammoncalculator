<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ER comparison example</title>
  <desc id="desc">A representative output from plot_er_comparison showing Sage ER 0.290 and GNU ER 0.180.</desc>
  <rect width="1200" height="650" fill="#FFFDFC"/>
  <text x="220" y="70" fill="#11182F" font-family="sans-serif" font-size="40" font-weight="700">Overall ER</text>
  <text x="220" y="110" fill="#5F626E" font-family="sans-serif" font-size="25">Lower is better</text>
  <line x1="220.0" y1="150" x2="220.0" y2="540" stroke="#D9CCC0" stroke-width="2"/>
  <text x="220.0" y="582" text-anchor="middle" fill="#1B2040" font-family="sans-serif" font-size="21">0.0</text>
  <line x1="464.4" y1="150" x2="464.4" y2="540" stroke="#D9CCC0" stroke-width="2"/>
  <text x="464.4" y="582" text-anchor="middle" fill="#1B2040" font-family="sans-serif" font-size="21">0.1</text>
  <line x1="708.9" y1="150" x2="708.9" y2="540" stroke="#D9CCC0" stroke-width="2"/>
  <text x="708.9" y="582" text-anchor="middle" fill="#1B2040" font-family="sans-serif" font-size="21">0.2</text>
  <line x1="953.3" y1="150" x2="953.3" y2="540" stroke="#D9CCC0" stroke-width="2"/>
  <text x="953.3" y="582" text-anchor="middle" fill="#1B2040" font-family="sans-serif" font-size="21">0.3</text>
  <text x="192" y="259" text-anchor="end" fill="#11182F" font-family="sans-serif" font-size="29" font-weight="700">Sage</text>
  <line x1="220" y1="250" x2="928.9" y2="250" stroke="#D9CCC0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="928.9" cy="250" r="17" fill="#915634"/>
  <text x="958.9" y="259" fill="#11182F" font-family="sans-serif" font-size="27" font-weight="700">0.290</text>
  <text x="192" y="399" text-anchor="end" fill="#11182F" font-family="sans-serif" font-size="29" font-weight="700">GNU</text>
  <line x1="220" y1="390" x2="660.0" y2="390" stroke="#D9CCC0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="660.0" cy="390" r="17" fill="#3D5F87"/>
  <text x="690.0" y="399" fill="#11182F" font-family="sans-serif" font-size="27" font-weight="700">0.180</text>
  <text x="660.0" y="626" text-anchor="middle" fill="#1B2040" font-family="sans-serif" font-size="24" font-weight="700">ER</text>
</svg>
