name: Create v0.2.0 tag

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag merged 0.2.0 release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: a385a963ed01a6eac083dae7a1b246b1c150b3eb
      TAG_NAME: v0.2.0

    steps:
      - name: Verify master is the intended release commit
        shell: bash
        run: |
          set -euo pipefail
          master_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          test "${master_sha}" = "${TARGET_SHA}"
          echo "Verified master at ${master_sha}"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha' 2>/dev/null || true)"

          if [ -n "${existing}" ]; then
            test "${existing}" = "${TARGET_SHA}"
            echo "${TAG_NAME} already exists at ${existing}"
            exit 0
          fi

          body="$(printf '{\"ref\":\"refs/tags/%s\",\"sha\":\"%s\"}' "${TAG_NAME}" "${TARGET_SHA}")"
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "${body}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs")"
          cat "${response_file}"
          echo
          echo "GitHub create-ref HTTP status: ${status}"
          test "${status}" = '201'

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')"
          test "${tag_sha}" = "${TARGET_SHA}"
          echo "Verified ${TAG_NAME} at ${tag_sha}"
