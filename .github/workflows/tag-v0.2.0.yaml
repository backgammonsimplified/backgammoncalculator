name: Create v0.2.0 tag

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag merged 0.2.0 release
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: a385a963ed01a6eac083dae7a1b246b1c150b3eb
      TAG_NAME: v0.2.0

    steps:
      - name: Verify master is the intended release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          master_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          test "${master_sha}" = "${TARGET_SHA}"
          echo "Verified master at ${master_sha}"

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
            test "${remote_sha}" = "${TARGET_SHA}"
            echo "${TAG_NAME} already exists at ${remote_sha}"
          else
            git tag "${TAG_NAME}" "${TARGET_SHA}"
            git push origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          fi

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
          test "${remote_sha}" = "${TARGET_SHA}"
          echo "Verified ${TAG_NAME} at ${remote_sha}"
